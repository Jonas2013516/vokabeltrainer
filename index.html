<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vokabeltrainer</title><meta name="theme-color" content="#1E9A4E">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout: eine ruhige Spalte wie ein Lernkasten von oben – Holz, Waldgrün, klare Karten */
/* Layout: eine ruhige Spalte – frisches Grün und helles Blau, der Kasten als blauer Rahmen mit weißen Fächern; Braun nur auf der Startseite */
:root{
  --bg:#EEF7F1; --surface:#FFFFFF; --surface-2:#F0F7F3; --ink:#13261A; --muted:#52705F; --line:#CDE3D5;
  --green:#1E9A4E; --green-2:#D5F2DF; --on-green:#FFFFFF;
  --sky:#1C82D6; --sky-2:#DDEEFC; --box:#2E8FDD; --box-in:#E6F2FD;
  --wood:#8A5A33; --wood-2:#EEDFCB; --wood-3:#D9C3A5;
  --masc:#1442C2; --fem:#E1222B; --ok:#1E9A4E; --bad:#E1222B; --shadow:0 1px 2px rgba(19,38,26,.07),0 4px 14px rgba(19,38,26,.07);
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ipa:"Noto Sans",Roboto,"Segoe UI","DejaVu Sans",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1913; --surface:#16241B; --surface-2:#1C2D22; --ink:#E6F3EA; --muted:#9BB6A6; --line:#29402F;
  --green:#3CC56E; --green-2:#173A25; --on-green:#04140A;
  --sky:#5DB0F2; --sky-2:#14304A; --box:#1F5E96; --box-in:#122638;
  --wood:#C99566; --wood-2:#3A2B1D; --wood-3:#56402B;
  --masc:#86AFFF; --fem:#FF4A50; --ok:#3CC56E; --bad:#FF4A50; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1913; --surface:#16241B; --surface-2:#1C2D22; --ink:#E6F3EA; --muted:#9BB6A6; --line:#29402F;
  --green:#3CC56E; --green-2:#173A25; --on-green:#04140A;
  --sky:#5DB0F2; --sky-2:#14304A; --box:#1F5E96; --box-in:#122638;
  --wood:#C99566; --wood-2:#3A2B1D; --wood-3:#56402B;
  --masc:#86AFFF; --fem:#FF4A50; --ok:#3CC56E; --bad:#FF4A50; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 32px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.3rem;font-weight:650} h3{font-size:1.05rem;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tab{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:12px 10px;margin-bottom:6px}
.top h1,.top h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}
.badge{position:absolute;top:4px;right:3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.blue{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.end{border-color:var(--bad);color:var(--bad);background:transparent}
.start-btn{flex-direction:column;gap:2px;min-height:72px}
.start-btn .sub{font-size:.88rem;font-weight:600;opacity:.92}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.big{min-height:62px;font-size:1.15rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem;border-radius:10px}
.linkish{background:none;border:0;color:var(--sky);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* Startseite */
.brand{padding-block:28px 6px}
.brand .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--wood);font-weight:700}
.langs{display:grid;gap:14px}
.lang-card{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;padding:18px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);min-height:104px}
.lang-card .code{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:#fff}
.lang-card .code.fr{background:var(--sky)} .lang-card .code.en{background:var(--green)}
.lang-card .nm{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.due-pill{border-radius:999px;padding:6px 12px;background:var(--wood-2);color:var(--ink);font-weight:700;font-size:.9rem;white-space:nowrap}
.due-pill.zero{background:var(--surface-2);color:var(--muted)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--sky-2);border:1px solid var(--line)}
.banner .grow{display:flex;flex-direction:column;gap:6px}

/* Kasten-Darstellung */
.box{background:var(--box);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:var(--shadow)}
.abt{background:var(--box-in);border-radius:10px;padding:8px 10px 10px}
.abt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8rem;margin-bottom:6px}
.abt-h b{font-family:var(--f-display);font-size:.95rem}
.faecher{display:grid;gap:4px}
.fach{position:relative;height:30px;border-radius:5px;background:var(--surface);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.fach.has{color:var(--ink)}
.fach.mark{outline:3px solid var(--green);outline-offset:-1px;color:var(--ink);background:var(--green-2)}
.fach.mark::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:var(--green-2);outline:2px solid var(--green)}

.due-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:5px 11px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:76px}
.tile b{font-family:var(--f-display);font-size:1.02rem}
.tile span{font-size:.82rem;color:var(--muted)}

/* Abfrage */
.sess-head{display:flex;flex-direction:column;gap:6px}
.stage-name{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.dir{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:700;color:var(--sky)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:3px}
.card{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:26px 20px 22px;min-height:300px;display:flex;flex-direction:column;gap:14px;text-align:center;justify-content:center}
.card.tap{cursor:pointer}
.card .face{display:flex;flex-direction:column;gap:8px;align-items:center}
.card .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.word{font-family:var(--f-body);font-weight:700;font-size:1.9rem;line-height:1.2;overflow-wrap:anywhere}
.satz{font-size:1.1rem;line-height:1.4;max-width:30ch}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:1rem}
.art{font-weight:700}
.art.m{color:var(--masc)} .art.f{color:var(--fem)}
.q-small{opacity:.7;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.q-small .word{font-size:1.2rem} .q-small .satz{font-size:.95rem}
.notiz{background:var(--green-2);border-radius:10px;padding:10px 12px;font-size:.95rem;text-align:left;align-self:stretch}
.notiz b{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);display:block}
.meta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted)}
.card-tools{position:absolute;top:8px;right:8px;display:flex;gap:2px}
.answer-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{min-height:68px;border-radius:16px;border:0;font-size:1.25rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.ans.no{background:var(--bad)} .ans.yes{background:var(--ok)}
.ans:disabled{opacity:.3}

/* Listen & Formulare */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.85rem;font-weight:700}
.field .req{color:var(--bad)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .nr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;min-width:2.6em}
.item .w{font-weight:700;overflow-wrap:anywhere}
.item .d{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.st{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.inaktiv{background:var(--surface-2);color:var(--muted)} .st.neu,.st.kasten{background:var(--sky-2);color:var(--sky)} .st.ablage{background:var(--green-2);color:var(--green)}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:700;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sticky-bottom{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px 12px;font-variant-numeric:tabular-nums;align-items:baseline}
.kv .h{font-size:.75rem;color:var(--muted);font-weight:700;text-align:right}
.kv .n{text-align:right;font-weight:700}
.diff{font-size:.85rem;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.diff del{color:var(--bad)} .diff ins{color:var(--ok);text-decoration:none}

/* Modal, Toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,12,.5);display:grid;align-items:end;z-index:70;padding:16px}
.modal{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:528px;width:100%;margin:0 auto 0;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.chart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion: no-preference){.card{transition:transform .15s ease}.card.flip-in{animation:flip .22s ease}@keyframes flip{from{transform:rotateY(70deg);opacity:.4}to{transform:none;opacity:1}}}

.flabel{font-size:.85rem;font-weight:700}
.picked{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 4px 6px 12px;border-radius:10px;border:2px solid var(--green);background:var(--green-2)}
.picked .nr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;min-width:2.2em}
.picked .w{font-weight:700} .picked .d{color:var(--muted);font-size:.9rem}
.sug{margin-top:6px;max-height:320px;overflow-y:auto}
.top h2{font-size:1.2rem}
.top .btn.sm{flex:none}
.center{align-self:center;text-align:center}
.streak{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:2px 2px}
.streak b{color:var(--ink)}
.streak .dots{display:inline-flex;gap:5px}
.streak .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--green);display:block}
.streak .dots i.on{background:var(--green)}
.panel.goal{background:var(--sky-2);border-color:var(--line);gap:4px}
.panel.goal.done{background:var(--green-2)}
.errs{color:var(--bad);font-weight:700}
.card[data-swipe]{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw-label{position:absolute;top:14px;padding:5px 10px;border-radius:8px;font-weight:800;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .1s}
.sw-label.yes{left:14px;color:#fff;background:var(--ok)}
.sw-label.no{left:14px;color:#fff;background:var(--bad)}
.card.sw-yes{box-shadow:0 0 0 3px var(--ok),var(--shadow)} .card.sw-yes .sw-label.yes{opacity:1}
.card.sw-no{box-shadow:0 0 0 3px var(--bad),var(--shadow)} .card.sw-no .sw-label.no{opacity:1}
@media (prefers-reduced-motion: no-preference){.card[data-swipe]{transition:transform .18s ease,opacity .16s ease}}
.streak-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.snum{min-width:46px;height:46px;padding:0 8px;border-radius:12px;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums}
.goal-bar{display:flex;flex-direction:column;gap:6px}
.btn.ghost{background:var(--green-2);border-color:transparent;color:var(--green)}
.btn.undo{background:var(--sky-2);border-color:transparent;color:var(--sky);min-height:44px;padding:0 16px}
.chip.zero{color:var(--muted);opacity:.75}
.goal-ok{width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-weight:800}
.type-form{display:flex;flex-direction:column;gap:10px;align-self:stretch;text-align:left}
.type-in{font-size:1.25rem;min-height:54px;text-align:center;font-weight:700}
.acc-keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.acc{min-width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:1.1rem;font-weight:700}
.acc:active{background:var(--sky-2)}
.verdict{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;align-self:stretch}
.verdict.ok{background:var(--green-2);color:var(--green)}
.verdict.near{background:var(--sky-2);color:var(--sky)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.verdict span{color:var(--ink);font-size:.92rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-h{font-size:.72rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal-d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal-d.on{background:var(--green);color:var(--on-green);font-weight:700}
.cal-d.today{outline:2px solid var(--sky);outline-offset:-2px}
.btn.sm{white-space:nowrap}
.cal-nav{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:2px}
.cal-title{text-align:center;font-weight:700}
.flipx{display:inline-block;transform:scaleX(-1)}
.lang-card{grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:16px;width:100%}
.lang-card .code{width:56px;height:56px}
.lang-card>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.card-tools{z-index:3}
.speak-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.lefty .answer-btns .ans.no{order:2}
.panel.help ul{margin:6px 0 0;padding-left:20px;display:grid;gap:8px}
.panel.help li{line-height:1.45}
.lang-card{grid-template-columns:56px minmax(0,1fr);row-gap:8px}
.lang-card>span:nth-child(2){overflow-wrap:normal}
.lang-card .due-pill{grid-column:2;justify-self:start}
.lang-card .code{grid-row:span 2}
.note-item{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px}
.note-item.read{opacity:.65}
.note-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note-hint{font-size:.95rem}
.note-where{font-weight:700;color:var(--sky,#1e7fd8)}
.note-data{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.92rem;overflow-wrap:anywhere}
.note-data .nk{color:var(--muted,#6b7a72);font-size:.82rem;padding-top:2px}
.note-data .w{font-weight:700}
.note-item>.btn{justify-self:start}
.pts-total{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.pts-total b{font-size:1.25rem}
.pts-star{color:var(--sky);font-size:1.15rem}
.pts-line{margin-bottom:8px}
.pts-won{font-weight:800;color:var(--ok)}
.pts-plus{font-weight:800;color:var(--ok)} .pts-minus{font-weight:800;color:var(--bad)}
.goal-bad{color:var(--bad);font-weight:800}
/* Übergangs-Animation */
.trans{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(3px);animation:trIn .22s ease-out both;padding:16px}
.trans.out{animation:trOut .2s ease-in both}

<div id="app"></div>
<script>
/* ===== Vokabeltrainer – Kern: Daten und Kasten-Mechanik (ohne Oberfläche) ===== */
const VT = (() => {
  const SIZES = { 1: 1, 2: 2, 3: 7, 4: 30 };
  const ABT_NAMES = { 1: 'Eintagfach', 2: 'Zweitagefach', 3: 'Wochenfach', 4: 'Monatsfach' };
  const LANGS = {
    fr: { name: 'Französisch', short: 'FR', tts: 'fr-FR', word: 'Französisch' },
    en: { name: 'Englisch', short: 'EN', tts: 'en-GB', word: 'Englisch' }
  };
  const TEXT_FIELDS = ['fremd', 'lautschrift', 'genus', 'deutsch', 'satz_fremd', 'satz_deutsch', 'notiz', 'seite', 'abschnitt'];
  const DAY = 86400000;

  function now() { return Date.now(); }

  function newLang() {
    return { cards: {}, nextId: 1, markers: { 2: 0, 3: 0, 4: 0 }, sessionCount: 0, session: null, log: [], lastSummary: null, points: START_BONUS, startBonus: true };
  }
  function newState() {
    return { version: 1, createdAt: now(), lastExport: null, langs: { fr: newLang(), en: newLang() }, notes: [], nextNote: 1 };
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function cardsOf(L) { return Object.values(L.cards); }

  /* ---- Karten anlegen ---- */
  function makeCard(L, data) {
    const id = 'c' + (L.nextId++);
    const c = {
      id, buch: (data.buch || 'Eigene Vokabeln').trim(), nr: Number(data.nr) || nextNr(L, data.buch || 'Eigene Vokabeln'),
      seite: data.seite === '' || data.seite == null ? null : Number(data.seite),
      abschnitt: (data.abschnitt || '').trim(), fremd: (data.fremd || '').trim(), lautschrift: (data.lautschrift || '').trim(),
      genus: data.genus === 'm' || data.genus === 'f' ? data.genus : '', deutsch: (data.deutsch || '').trim(),
      satz_fremd: (data.satz_fremd || '').trim(), satz_deutsch: (data.satz_deutsch || '').trim(), notiz: (data.notiz || '').trim(),
      status: 'inaktiv', abt: null, fach: null, created: now(), doneAt: null
    };
    L.cards[id] = c;
    return c;
  }
  function nextNr(L, buch) {
    let m = 0;
    for (const c of cardsOf(L)) if (c.buch === buch && c.nr > m) m = c.nr;
    return m + 1;
  }
  function findByBuchNr(L, buch, nr) {
    for (const c of cardsOf(L)) if (c.buch === buch && c.nr === nr) return c;
    return null;
  }
  function books(L) { return [...new Set(cardsOf(L).map(c => c.buch))].sort((a, b) => a.localeCompare(b, 'de')); }

  /* ---- auf Neu legen (aktivieren / zurückholen / falsch) ---- */
  function toNeu(L, c) {
    c.status = 'neu'; c.abt = null; c.fach = null;
    const s = L.session;
    if (s && s.stage === 'neu' && !s.queue.slice(s.pos).some(q => q.id === c.id)) {
      s.queue.push({ id: c.id, dir: 'de' }, { id: c.id, dir: 'fr' });
    }
  }
  function activate(L, ids) {
    let n = 0;
    for (const id of ids) { const c = L.cards[id]; if (c && c.status === 'inaktiv') { toNeu(L, c); keepInSnap(L, c); n++; } }
    return n;
  }
  // Änderungen außerhalb der Abfrage (aktivieren, zurückholen) sollen ein Verwerfen der Sitzung überstehen
  function keepInSnap(L, c) { if (L.session && L.session.snap) L.session.snap[c.id] = ['neu', null, null, null, c.errs || 0]; }
  function retrieve(L, ids) {
    let n = 0;
    for (const id of ids) { const c = L.cards[id]; if (c && c.status === 'ablage') { c.doneAt = null; toNeu(L, c); keepInSnap(L, c); n++; } }
    return n;
  }

  /* ---- Fächer ---- */
  function fachCards(L, abt, fach) {
    return cardsOf(L).filter(c => c.status === 'kasten' && c.abt === abt && c.fach === fach);
  }
  function currentFach(L, abt) { return abt === 1 ? 0 : L.markers[abt]; }
  function dueCounts(L) {
    const r = { 4: 0, 3: 0, 2: 0, 1: 0, neu: 0 };
    for (const c of cardsOf(L)) {
      if (c.status === 'neu') r.neu++;
      else if (c.status === 'kasten' && c.fach === currentFach(L, c.abt)) r[c.abt]++;
    }
    r.total = r[4] + r[3] + r[2] + r[1] + r.neu;
    return r;
  }
  function counts(L) {
    const r = { inaktiv: 0, neu: 0, 1: 0, 2: 0, 3: 0, 4: 0, ablage: 0, all: 0 };
    for (const c of cardsOf(L)) { r.all++; if (c.status === 'kasten') r[c.abt]++; else r[c.status]++; }
    r.kasten = r.neu + r[1] + r[2] + r[3] + r[4];
    return r;
  }

  /* ---- Sitzung ---- */
  const ORDER = ['4', '3', '2', '1', 'neu', 'done'];

  function startSession(L) {
    if (L.session) return L.session;
    const snap = {};
    for (const c of cardsOf(L)) snap[c.id] = [c.status, c.abt, c.fach, c.doneAt, c.errs || 0];
    L.session = { startedAt: now(), stage: null, queue: [], pos: 0, flipped: false, res: {}, done: 0, snap, logLen: L.log.length, pts: 0, pts0: L.points || 0 };
    enterStage(L, '4');
    return L.session;
  }
  function enterStage(L, stage) {
    const s = L.session;
    while (true) {
      s.stage = stage; s.pos = 0; s.flipped = false; s.queue = [];
      if (stage === 'done') { finishSession(L); return; }
      if (stage === 'neu') {
        const ids = cardsOf(L).filter(c => c.status === 'neu').map(c => c.id);
        s.queue = shuffle(ids).map(id => ({ id, dir: 'de' })).concat(shuffle(ids).map(id => ({ id, dir: 'fr' })));
      } else {
        const k = Number(stage);
        const ids = fachCards(L, k, currentFach(L, k)).map(c => c.id);
        s.queue = shuffle(ids).map(id => ({ id, dir: k === 2 ? 'fr' : 'de' }));
      }
      s.res[stage] = s.res[stage] || { ok: 0, bad: 0 };
      if (s.queue.length) return;
      stage = ORDER[ORDER.indexOf(stage) + 1];
    }
  }
  function currentItem(L) {
    const s = L.session; if (!s || s.stage === 'done') return null;
    while (s.pos < s.queue.length && !L.cards[s.queue[s.pos].id]) s.pos++;
    if (s.pos >= s.queue.length) { enterStage(L, ORDER[ORDER.indexOf(s.stage) + 1]); return L.session ? currentItem(L) : null; }
    return s.queue[s.pos];
  }
  function answer(L, ok) {
    const s = L.session; const item = currentItem(L); if (!item) return;
    const c = L.cards[item.id];
    const st = s.stage;
    // Rückgängig: Zustand vor dieser Antwort merken (die letzten 10)
    s.undo = (s.undo || []).slice(-9);
    s.undo.push({ s: JSON.stringify({ stage: s.stage, queue: s.queue, pos: s.pos, res: s.res, done: s.done }),
      card: [c.id, c.status, c.abt, c.fach, c.doneAt, c.errs || 0, c.lastErr || null], logLen: L.log.length, pts: [L.points || 0, s.pts || 0] });
    if (ok) { L.points = (L.points || 0) + PTS_CARD; s.pts = (s.pts || 0) + PTS_CARD; }
    s.res[st] = s.res[st] || { ok: 0, bad: 0 };
    s.res[st][ok ? 'ok' : 'bad']++;
    if (st === 'neu') {
      if (!ok) insertRepeat(s.queue, s.pos, { id: c.id, dir: item.dir });
    } else {
      const k = Number(st);
      if (ok) {
        if (k === 4) { c.status = 'ablage'; c.abt = null; c.fach = null; c.doneAt = now(); s.done++; L.log.push({ t: now(), k: 'd' }); }
        else { c.abt = k + 1; c.fach = L.markers[k + 1]; }
      } else {
        L.log.push({ t: now(), k: 'f' });
        c.errs = (c.errs || 0) + 1; c.lastErr = now();
        toNeu(L, c);
      }
    }
    s.pos++; s.flipped = false; s.check = null;
    if (s.pos >= s.queue.length) enterStage(L, ORDER[ORDER.indexOf(st) + 1]);
  }
  // falsche Karte direkt nach dem Block derselben Richtung wiederholen (De→Fr-Fehler vor dem Fr→De-Teil)
  function insertRepeat(q, pos, item) {
    let at = pos + 1;
    for (let i = q.length - 1; i > pos; i--) if (q[i].dir === item.dir) { at = i + 1; break; }
    q.splice(at, 0, item);
  }
  function undo(L) {
    const s = L.session; if (!s || !s.undo || !s.undo.length) return false;
    const u = s.undo.pop();
    Object.assign(s, JSON.parse(u.s)); s.flipped = false; s.check = null;
    const c = L.cards[u.card[0]];
    if (c) { [, c.status, c.abt, c.fach, c.doneAt, c.errs, c.lastErr] = u.card; }
    L.log.length = Math.min(L.log.length, u.logLen);
    if (u.pts) { L.points = u.pts[0]; s.pts = u.pts[1]; }
    return true;
  }
  function finishSession(L) {
    const s = L.session;
    L.log.push({ t: now(), k: 's' });
    for (const c of cardsOf(L)) if (c.status === 'neu') { c.status = 'kasten'; c.abt = 1; c.fach = 0; }
    for (const k of [2, 3, 4]) L.markers[k] = (L.markers[k] + 1) % SIZES[k];
    L.sessionCount++;
    L.points = (L.points || 0) + PTS_SESSION; s.pts = (s.pts || 0) + PTS_SESSION;
    const goal = checkGoal(L);
    L.lastSummary = { at: now(), res: s.res, done: s.done, nr: L.sessionCount, pts: s.pts, goal, plant: plantCheck(L), pointsEnd: L.points };
    L.session = null;
  }
  // Sitzung abbrechen: Kasten wieder wie vor der Sitzung, Marker unverändert
  function cancelSession(L) {
    const s = L.session; if (!s) return false;
    if (s.snap) {
      for (const id in s.snap) { const c = L.cards[id]; if (!c) continue; const v = s.snap[id]; [c.status, c.abt, c.fach, c.doneAt] = v; c.errs = v[4] || 0; }
      if (typeof s.logLen === 'number') L.log.length = Math.min(L.log.length, s.logLen);
      if (typeof s.pts0 === 'number') L.points = s.pts0;
    }
    L.session = null;
    return true;
  }
  function stageProgress(L) {
    const s = L.session; if (!s) return null;
    return { stage: s.stage, pos: s.pos, total: s.queue.length };
  }

  /* ---- Lernserie: Tage am Stück mit mindestens einer abgeschlossenen Sitzung ---- */
  const HARD_MIN = 2;      // ab so vielen Fehlern gilt eine Vokabel als „oft falsch“
  const GOAL_MIN = 2;      // kleinstes Tagesziel
  function dayKey(t) { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function streak(L) {
    const days = new Set(L.log.filter(e => e.k === 's').map(e => dayKey(e.t)));
    const d = new Date(now()); d.setHours(12, 0, 0, 0);
    const today = days.has(dayKey(d.getTime()));
    if (!today) d.setDate(d.getDate() - 1);   // heute noch offen: Serie zählt bis gestern
    let n = 0;
    while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
    return { days: n, today, total: L.sessionCount };
  }
  /* ---- Punkte und Ziel als Wette ---- */
  const PTS_CARD = 1, PTS_SESSION = 5;
  function goalStake(n) { return n * 10; }
  function goalBonus(n, stake) { return Math.round((stake == null ? goalStake(n) : stake) * n / 2); }
  const START_BONUS = 20;
  // Startguthaben einmalig (auch für ältere Daten)
  function grantStartBonus(L) { if (L.startBonus) return false; L.points = (L.points || 0) + START_BONUS; L.startBonus = true; return true; }
  function sessionDays(L) { return new Set(L.log.filter(e => e.k === 's').map(e => dayKey(e.t))); }
  // Fortschritt eines Wett-Ziels: Lerntage ab dem Tag des Setzens; ein ausgelassener Tag dazwischen = verloren
  function goalProgress(L) {
    const g = L.goal; if (!g) return null;
    if (!g.v) { const n = streak(L).days; return { n: Math.min(n, g.days), failed: false }; }   // altes Ziel ohne Einsatz
    const days = sessionDays(L); const today = dayKey(now());
    const d = new Date(g.setAt); d.setHours(12, 0, 0, 0);
    let n = 0, failed = false;
    for (let i = 0; i < 4000; i++) {
      const k = dayKey(d.getTime());
      if (days.has(k)) n++;
      else if (i > 0 && k !== today) { failed = true; break; }
      if (k >= today) break;
      d.setDate(d.getDate() + 1);
    }
    return { n: Math.min(n, g.days), failed };
  }
  function setGoal(L, n, wish) {
    settleGoal(L);
    n = Math.max(GOAL_MIN, Math.round(n));
    const stake = Math.max(goalStake(n), Math.round(Number(wish) || 0));
    if ((L.points || 0) < stake) return { error: 'points', need: stake };
    if (L.goal) dropGoal(L);
    L.points = (L.points || 0) - stake;
    L.goal = { v: 2, days: n, setAt: now(), stake };
    return L.goal;
  }
  // Ziel löschen/ändern: der Einsatz ist dann weg
  function dropGoal(L) {
    const g = L.goal; if (!g) return null;
    (L.goalsDone = L.goalsDone || []).push({ days: g.days, at: now(), ok: false, stake: g.stake || 0, why: 'gelöscht' });
    L.goal = null; return g;
  }
  function checkGoal(L) {
    const g = L.goal; if (!g) return null;
    const p = goalProgress(L);
    if (p.failed) return null;
    if (p.n >= g.days) {
      const bonus = g.v ? goalBonus(g.days, g.stake) : 0, back = g.stake || 0;
      L.points = (L.points || 0) + back + bonus;
      const r = { days: g.days, at: now(), ok: true, stake: back, bonus, points: L.points };
      (L.goalsDone = L.goalsDone || []).push(r); L.goal = null; return r;
    }
    return null;
  }
  // beim Öffnen: verpasstes Ziel abrechnen
  function settleGoal(L) {
    const g = L.goal; if (!g || !g.v) return null;
    const p = goalProgress(L); if (!p.failed) return null;
    const r = { days: g.days, at: now(), ok: false, stake: g.stake || 0, why: 'verpasst', points: L.points || 0 };
    (L.goalsDone = L.goalsDone || []).push(r); L.goal = null; return r;
  }
  /* ---- Pflanze: wächst mit den Tagen am Stück ---- */

  /* ---- Schreib-Modus: eingetippte Antwort prüfen ---- */
  const FILL = /(^|\s)(qc|qn|qn\/qc|qc\/qn|etw\.?|jdn\.?|jdm\.?|jds\.?|jdn\.\/etw\.|sb|sth|so\.|sth\.)(?=\s|$)/g;

/* ===== Vokabeltrainer – Oberfläche ===== */
(() => {
/* ===== Effekte: Töne, Vibration, Antwort-Animationen, Maskottchen und Szenen ===== */
function soundOn() { return !(S.settings && S.settings.sound === false); }
function vibeOn() { return !(S.settings && S.settings.vibe === false); }
let actx = null;
function tone(seq) {
  if (!soundOn()) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    let t = actx.currentTime + 0.01;
    for (const [f, d, type, vol] of seq) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.03); t += d * 0.75;
    }
  } catch (e) {}
}
function sndOk() { tone([[660, 0.09], [990, 0.15]]); }
function sndBad() { tone([[196, 0.24, 'triangle', 0.22]]); }
function vibe(ms) { if (!vibeOn()) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---- Antwort-Feedback: alte Karte als Kopie animieren, neue Karte federt herein ---- */
function cardGhost(ok) {
  const old = document.querySelector('#app .card'); if (!old) return;
  const r = old.getBoundingClientRect(); if (!r.width) return;
  const g = old.cloneNode(true); g.removeAttribute('data-a'); g.removeAttribute('data-swipe');
  g.querySelectorAll('[data-a],[id]').forEach(x => { x.removeAttribute('data-a'); x.removeAttribute('id'); });
  g.classList.add('fx-ghost', ok ? 'fx-ok' : 'fx-shake');
  Object.assign(g.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  g.insertAdjacentHTML('beforeend', `<div class="fx-badge ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</div>`);
  // im Shadow-DOM, damit die Kopie nicht als echte Karte zählt
  const host = document.createElement('div'); host.className = 'fx-ghost-host'; host.setAttribute('aria-hidden', 'true');
  const root = host.attachShadow ? host.attachShadow({ mode: 'closed' }) : host;
  const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
  const st = document.createElement('style'); st.textContent = css; root.appendChild(st); root.appendChild(g);
  if (document.documentElement.classList.contains('lefty')) g.classList.add('lefty');
  document.body.appendChild(host); setTimeout(() => host.remove(), ok ? 420 : 520);
}
function answerFx(ok) {
  if (ok) { sndOk(); ui.combo = (ui.combo || 0) + 1; } else { sndBad(); vibe(90); ui.combo = 0; }
  const nc = document.querySelector('#app .card'); if (nc) nc.classList.add(ok ? 'fx-in' : 'fx-in-late');
  if (ok && [3, 5, 10, 15, 20, 25, 30, 40, 50, 75, 100].includes(ui.combo)) {
    document.querySelectorAll('.fx-combo').forEach(x => x.remove());
    const c = document.createElement('div'); c.className = 'fx-combo'; c.setAttribute('role', 'status'); c.textContent = ui.combo + ' in Folge!';
    document.body.appendChild(c); setTimeout(() => c.remove(), 1500);
  }
}
// Fortschrittsbalken federt vom alten auf den neuen Stand
function springBars() {
  document.querySelectorAll('#app .bar i[data-to]').forEach(el => { requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.to + '%'; })); });
}
// Zahlen zählen hoch
function countUps() {
  document.querySelectorAll('#app [data-count-to]').forEach(el => {
    const a = +el.dataset.countFrom || 0, b = +el.dataset.countTo, t0 = performance.now(), dur = 900;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(a + (b - a) * e); if (p < 1 && el.isConnected) requestAnimationFrame(step); };
    el.textContent = a; requestAnimationFrame(step);
  });
}

/* ---- Übergänge in der Sitzung: Karte dreht sich um ---- */
function showTransition(before, after) {
  if (!before || !after) return;
  const lang = ui.lang; const sameStage = before.stage === after.stage;
  if (sameStage && before.dir === after.dir) return;
  document.querySelectorAll('.trans').forEach(x => x.remove());
  const dirLbl = d => dirText(lang, d);
  const shortStage = st => st === 'neu' ? 'Neue Karten' : st === 'pr' ? 'Freies Üben' : VT.ABT_NAMES[st];
  let front, backTop, backSub;
  if (sameStage) { front = `<span class="tf-small">geschafft</span>${esc(dirLbl(before.dir))} ✓`; backTop = esc(dirLbl(after.dir)); backSub = 'jetzt umgekehrt'; }
  else {
    front = `<span class="tf-small">geschafft</span>${before.stage === 'neu' ? 'Neue Karten' : 'Abteilung ' + before.stage} ✓`;
    backTop = esc(shortStage(after.stage)); backSub = (after.stage === 'neu' ? esc(dirLbl(after.dir)) + ' · ' : '') + after.n + (after.n === 1 ? ' Karte' : ' Karten');
  }
  const el = document.createElement('div'); el.className = 'trans'; el.setAttribute('role', 'status');
  el.innerHTML = `<div class="trans-flip"><div class="tf-in"><div class="tf-face">${front}</div><div class="tf-face back">${backTop}<span class="tf-small">${backSub}</span></div></div></div>`;
  const close = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); close(); });
  el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  document.body.appendChild(el); setTimeout(close, 2500);
}

/* ---- Maskottchen: ruhiges Bild für die Sprachseite ---- */
function starsSVG(n) {
  if (n > 3) return `<g transform="translate(150 130)"><text text-anchor="middle" y="7" font-family="Fredoka,Nunito,sans-serif" font-weight="700" font-size="20" fill="#fff" stroke="#1B2A3A" stroke-width="4" paint-order="stroke">★ ${n}</text></g>`;
  const xs = n === 1 ? [150] : n === 2 ? [136, 164] : [124, 150, 176];
  return xs.map(x => `<g class="st" transform="translate(${x} 130) scale(1.25)">${MASCOT.star}</g>`).join('');
}
function fillMascot(svg, st, live) {
  const put = (id, html) => { svg = svg.replace(`<g id="m-${id}"></g>`, `<g id="m-${id}">${html}</g>`); };
  put('plantNew', MASCOT.plants[st.plant]);
  if (st.nest) { put('nestBase', MASCOT.nest); put('bird', MASCOT.bird); }
  if (st.swing) put('addSwing', MASCOT.swing);
  if (st.house) put('addHouse', MASCOT.house);
  if (st.stars) put('addStars', starsSVG(st.stars));
  svg = svg.replace('<g id="m-pot">', '<g id="m-pot" transform="translate(0 -10)">');
  if (live) svg = svg.replace(/viewBox="[^"]*"/, st.idx >= 4 || st.house ? 'viewBox="0 20 440 560"' : st.idx >= 3 ? 'viewBox="0 80 440 500"' : 'viewBox="0 130 440 450"');
  if (!live) svg = svg.replace(/ id="m-[^"]*"/g, '').replace('class="m-stage"', 'class="m-mini" aria-hidden="true"').replace('clip-path="url(#m-clip)"', '').replace(/ role="img" aria-label="[^"]*"/, '').replace(/viewBox="[^"]*"/, 'viewBox="78 10 290 560"');
  return svg;
}
function mascotMini(days) { return fillMascot(MASCOT.svg, VT.plantState(days), false); }
function leavesHTML(st) {
  const n = Math.min(st.since, 12); if (!n) return '';

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function modal(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  onMount && onMount(bg.querySelector('.modal'), close);
  return close;
}
function confirmBox({ title, text, ok = 'OK', danger = false }) {
  return new Promise(res => {
    modal(`<h2>${esc(title)}</h2><p>${text}</p><div class="two"><button class="btn" data-x="no">Abbrechen</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-x="yes">${esc(ok)}</button></div>`,
      (m, close) => m.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; close(); res(b.dataset.x === 'yes'); }));
  });
}

/* ---------- Navigation (Android-Zurück-Taste über einen History-Eintrag) ---------- */
function ensureTrap() { if (views.length > 1 && !trapped) { try { history.pushState({ trap: 1 }, ''); trapped = true; } catch (e) {} } }
function go(v) { views.push(v); ensureTrap(); window.scrollTo(0, 0); render(); }
function back() { if (views.length > 1) { views.pop(); window.scrollTo(0, 0); render(); } }
function setViews(arr) { views = arr; ensureTrap(); window.scrollTo(0, 0); render(); }
window.addEventListener('popstate', () => {
  trapped = false;
  if (document.querySelector('.modal-bg')) { document.querySelectorAll('.modal-bg').forEach(m => m.remove()); ensureTrap(); return; }
  if (views.length > 1) { const v = view(); if (v.v === 'session') flush(); back(); }
  ensureTrap();
});

function homeTarget() { return views[1] && views[1].lang ? [views[0], views[1]] : [views[0]]; }

function topbar(title, { backBtn = true, bell = true, gear = true, lang, help = true } = {}) {
  const u = unread(lang);

    ${gear ? `<button class="icon-btn" data-a="settings" aria-label="Einstellungen">${ICON.gear}</button>` : ''}
  </header>`;
}
function fremdHTML(c, lang) {
  const w = c.fremd || '';
  if (lang === 'fr') {
    const m = w.match(/^(les|le|la|une|un|des)(\s+)(.+)$/i) || w.match(/^(l['’])()(.+)$/i);
    if (m) {
      const a = m[1].toLowerCase();
      let g = (a === 'le' || a === 'un') ? 'm' : (a === 'la' || a === 'une') ? 'f' : c.genus;
      return `<span class="art ${g || ''}">${esc(m[1])}</span>${esc(m[2])}${esc(m[3])}`;
    }

}
function metaLine(c) {

}
function statusLabel(c) {

  if (c.status === 'neu') return '<span class="st neu">Neu</span>';

  return '<span class="st inaktiv">inaktiv</span>';
}
// Abkürzungen nur fürs Vorlesen ausschreiben (Anzeige bleibt unverändert)
function ttsText(t, lang) {
  const B = '(^|[\\s(\\[/,;:.!?«»"\'’])', E = '(?=$|[\\s)\\]/,;:.!?«»"\'’])';
  const R = (s, a, b) => s.replace(new RegExp(B + a + E, 'gi'), (m, p) => p + b);
  t = String(t || '');
  if (lang === 'fr') { t = R(t, 'qn\\s*/\\s*qc', 'quelqu’un ou quelque chose'); t = R(t, 'qc\\s*/\\s*qn', 'quelque chose ou quelqu’un'); t = R(t, 'qn', 'quelqu’un'); t = R(t, 'qc', 'quelque chose'); }
  if (lang === 'en') { t = R(t, "sb's", "somebody's"); t = R(t, 'sb', 'somebody'); t = R(t, 'sth', 'something'); t = R(t, 'so\\.', 'someone'); }
  return t;
}
function speak(text, lang, silent) {

    if (!('speechSynthesis' in window)) { if (!silent) toast('Vorlesen wird auf diesem Gerät nicht unterstützt.'); return; }
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(ttsText(text, lang)); u.lang = VT.LANGS[lang].tts; u.rate = .8; speechSynthesis.speak(u);
  } catch (e) { if (!silent) toast('Vorlesen hat nicht geklappt.'); }
}

/* ---------- Freies Üben ---------- */
function prBase(Lg) { return VT.cardsOf(Lg).filter(c => c.buch === ui.pr.buch && (!ui.pr.onlyActive || c.status !== 'inaktiv')); }
function prListFiltered(Lg) {

}

}

function practiceBtnLabel(n) { return n ? n + (n === 1 ? ' Vokabel üben' : ' Vokabeln üben') : 'Keine passenden Vokabeln'; }

function practicePool(Lg) {

    if (!(f && t)) return [f || t];
    const a = Math.min(f.nr, t.nr), b = Math.max(f.nr, t.nr);

  let list = VT.cardsOf(Lg).filter(c => c.buch === pr.buch);

}

// erste noch inaktive Vokabel nach der zuletzt aktivierten (im gewählten Buch)
function nextAfterLast(Lg) {

  const act = all.filter(c => c.status !== 'inaktiv'); const last = act.length ? Math.max(...act.map(c => c.nr)) : 0;
  return all.find(c => c.status === 'inaktiv' && c.nr > last) || null;
}
function actCards(Lg) { return VT.cardsOf(Lg).filter(c => c.buch === ui.actBuch); }
function actRange(Lg) {
  const all = actCards(Lg); const f = Lg.cards[ui.actFromId], t = Lg.cards[ui.actToId];
  let list = [];
  if (f && t) { const a = Math.min(f.nr, t.nr), b = Math.max(f.nr, t.nr); list = all.filter(c => c.nr >= a && c.nr <= b); }
  else if (f || t) list = [f || t];
  else if (ui.actSeite) list = all.filter(c => String(c.seite) === ui.actSeite);
  return list.sort((a, b) => a.nr - b.nr);
}
const PK = {
  act: { cards: Lg => actCards(Lg).filter(c => !ui.actSeite || String(c.seite) === ui.actSeite), inputId: w => 'act_' + w, sugId: w => 'sug_' + w, hint: () => !!ui.actSeite },
  pr: { cards: Lg => prBase(Lg), inputId: w => 'pr_' + w, sugId: w => 'sugpr_' + w, hint: () => false }
};
function pkKey(pfx, which, kind) { return pfx + (which === 'from' ? 'From' : 'To') + kind; }
function sugRows(Lg, which, lang, pfx = 'act') {

  let list = PK[pfx].cards(Lg);
  if (q) { const num = /^\d+$/.test(q); list = list.filter(c => (num && String(c.nr).startsWith(q)) || norm(c.fremd).includes(q) || norm(c.deutsch).includes(q)); }
  const nx = pfx === 'act' && which === 'from' ? nextAfterLast(Lg) : null;
  list.sort((a, b) => {
    if (nx && (a.id === nx.id || b.id === nx.id)) return a.id === nx.id ? -1 : 1;
    if (q) { const sa = norm(a.fremd).startsWith(q) ? 0 : 1, sb = norm(b.fremd).startsWith(q) ? 0 : 1; if (sa !== sb) return sa - sb; }
    return a.nr - b.nr;
  });
  if (!list.length) return '<p class="small muted">Kein passendes Wort gefunden.</p>';
  const max = 40;
  return `<div class="list sug">${list.slice(0, max).map(c => `<button class="item" data-a="pick" data-pfx="${pfx}" data-which="${which}" data-id="${c.id}"><span class="nr">${c.nr}</span><span class="grow"><span class="w">${fremdHTML(c, lang)}</span><br><span class="d">${esc(c.deutsch)}${c.seite != null ? ' · S. ' + c.seite : ''}</span></span>${nx && c.id === nx.id ? '<span class="st next">weiter ab hier</span>' : statusLabel(c)}</button>`).join('')}</div>
    ${list.length > max ? `<p class="small muted">${list.length - max} weitere – tippe genauer.</p>` : ''}`;

};

function filteredCards(Lg, mode) {
  const q = norm(ui.listQ.trim());
  let list = VT.cardsOf(Lg);
  if (mode === 'ablage') list = list.filter(c => c.status === 'ablage');
  else if (mode === 'hard') list = list.filter(c => (c.errs || 0) >= VT.HARD_MIN);
  else if (ui.listStatus === 'inaktiv') list = list.filter(c => c.status === 'inaktiv');
  else if (ui.listStatus === 'kasten') list = list.filter(c => c.status === 'kasten' || c.status === 'neu');
  else if (ui.listStatus === 'ablage') list = list.filter(c => c.status === 'ablage');
  if (ui.listBuch) list = list.filter(c => c.buch === ui.listBuch);
  if (ui.listAbschnitt) list = list.filter(c => c.abschnitt === ui.listAbschnitt);
  if (ui.listSeite) list = list.filter(c => String(c.seite) === ui.listSeite);
  if (q) {
    const isNum = /^\d+$/.test(q);
    list = list.filter(c => (isNum && String(c.nr).startsWith(q)) || norm(c.fremd).includes(q) || norm(c.deutsch).includes(q));
  }
  if (mode === 'hard') return list.sort((a, b) => b.errs - a.errs || (b.lastErr || 0) - (a.lastErr || 0));
  return list.sort((a, b) => a.buch.localeCompare(b.buch, 'de') || a.nr - b.nr);
}
function hardSelIds(Lg) { return filteredCards(Lg, 'hard').map(c => c.id).filter(id => ui.hardSel.has(id)); }
function hardAllLabel(Lg) { const all = filteredCards(Lg, 'hard'); return all.length && all.every(c => ui.hardSel.has(c.id)) ? 'Auswahl aufheben' : 'Alle auswählen'; }
function hardGoLabel(Lg) { const n = hardSelIds(Lg).length; return n ? (n === 1 ? '1 Vokabel üben' : n + ' Vokabeln üben') : 'Vokabeln antippen'; }
function updHardBtns(Lg) { const a = document.getElementById('hardAllBtn'), g = document.getElementById('hardGoBtn'); if (a) a.textContent = hardAllLabel(Lg); if (g) { g.textContent = hardGoLabel(Lg); g.disabled = !hardSelIds(Lg).length; } }
function listRows(Lg, mode, lang) {
  const list = filteredCards(Lg, mode); const max = 300;
  if (!list.length) return '<div class="empty">Keine Vokabeln gefunden.</div>';
  return `<p class="small muted tab">${list.length} ${list.length === 1 ? 'Vokabel' : 'Vokabeln'}</p><div class="list">${list.slice(0, max).map(c => mode === 'hard'
    ? `<label class="item"><input type="checkbox" data-hsel="${c.id}" ${ui.hardSel.has(c.id) ? 'checked' : ''}><span class="grow"><span class="w">${fremdHTML(c, lang)}</span><br><span class="d">${esc(c.deutsch)} · <span class="errs">${c.errs}× falsch</span></span></span><button class="icon-btn" data-a="edit" data-id="${c.id}" aria-label="Bearbeiten">${ICON.pen}</button></label>`
    : mode === 'ablage'
    ? `<label class="item"><input type="checkbox" data-sel="${c.id}" ${ui.sel.has(c.id) ? 'checked' : ''}><span class="grow"><span class="w">${fremdHTML(c, lang)}</span><br><span class="d">${esc(c.deutsch)} · Nr. ${c.nr}</span></span><button class="icon-btn" data-a="edit" data-id="${c.id}" aria-label="Bearbeiten">${ICON.pen}</button></label>`
    : `<button class="item" data-a="edit" data-id="${c.id}"><span class="nr">${c.nr}</span><span class="grow"><span class="w">${fremdHTML(c, lang)}</span><br><span class="d">${esc(c.deutsch)}${c.errs ? ` · <span class="errs">${c.errs}× falsch</span>` : ''}</span></span>${statusLabel(c)}</button>`).join('')}</div>
    ${list.length > max ? `<p class="small muted">Es werden die ersten ${max} angezeigt. Suche genauer, um weitere zu finden.</p>` : ''}`;
}

function calendarHTML(Lg) {
  const base = new Date(); base.setDate(1); base.setHours(12, 0, 0, 0); base.setMonth(base.getMonth() + ui.calOff);
  const y = base.getFullYear(), m = base.getMonth(); const days = new Date(y, m + 1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const per = {}; for (const e of Lg.log) if (e.k === 's') { const k = VT.dayKey(e.t); per[k] = (per[k] || 0) + 1; }
  const today = VT.dayKey(Date.now()); let learned = 0; let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const k = y * 10000 + (m + 1) * 100 + d; const n = per[k] || 0; if (n) learned++;
    cells += `<span class="cal-d ${n ? 'on' : ''} ${k === today ? 'today' : ''}" title="${d}.${m + 1}.: ${n ? n + (n === 1 ? ' Sitzung' : ' Sitzungen') : 'nicht gelernt'}">${d}</span>`;
  }
  const name = base.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h3>Lernkalender</h3>
      ${ui.calOff ? '<button class="btn sm ghost" data-a="calMove" data-d="0">Heute</button>' : ''}</div>
    <div class="cal-nav">
      <button class="icon-btn" data-a="calMove" data-d="-12" aria-label="Ein Jahr zurück">${ICON.dback}</button>
      <button class="icon-btn" data-a="calMove" data-d="-1" aria-label="Vorheriger Monat">${ICON.back}</button>
      <span class="cal-title tab">${name}</span>
      <button class="icon-btn" data-a="calMove" data-d="1" aria-label="Nächster Monat"><span class="flipx">${ICON.back}</span></button>
      <button class="icon-btn" data-a="calMove" data-d="12" aria-label="Ein Jahr vor"><span class="flipx">${ICON.dback}</span></button>
    </div>
    <div class="cal">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => `<span class="cal-h">${d}</span>`).join('')}${cells}</div>
    <p class="small muted">${learned} ${learned === 1 ? 'Lerntag' : 'Lerntage'} im ${base.toLocaleDateString('de-DE', { month: 'long' })}. Grün = an diesem Tag mindestens eine Sitzung abgeschlossen.</p></div>`;
}
function chartSVG(wk) {
  const W = 320, H = 170, pl = 26, pb = 26, pt = 18, gw = (W - pl - 6) / wk.length;
  const max = Math.max(4, ...wk.map(w => Math.max(w.f, w.d)));
  const nice = Math.ceil(max / 4) * 4; const y = n => pt + (H - pt - pb) * (1 - n / nice);
  let g = '';
  for (let i = 0; i <= 4; i++) { const val = nice * i / 4; g += `<line x1="${pl}" x2="${W - 4}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 5}" y="${y(val) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${val}</text>`; }
  const bw = Math.min(12, gw / 2 - 3);
  wk.forEach((w, i) => {
    const x = pl + i * gw + gw / 2;
    g += `<rect x="${x - bw - 1}" y="${y(w.f)}" width="${bw}" height="${y(0) - y(w.f)}" rx="2" fill="var(--bad)"/>`;
    g += `<rect x="${x + 1}" y="${y(w.d)}" width="${bw}" height="${y(0) - y(w.d)}" rx="2" fill="var(--green)"/>`;
    const dt = new Date(w.start); g += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${dt.getDate()}.${dt.getMonth() + 1}.</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fehler und fertige Vokabeln pro Woche">${g}</svg>
    <div class="legend"><span><i style="background:var(--bad);outline:0"></i>Fehler</span><span><i style="background:var(--green);outline:0"></i>Fertig</span><span>Wochen ab Montag</span></div>`;
}

/* ---------- Rendern ---------- */
function bindSwipe() {
  const el = $app.querySelector('.card[data-swipe]'); if (!el) return;
  let x0 = null, y0 = 0, dx = 0, horiz = false;
  el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = false; });
  el.addEventListener('pointermove', e => {
    if (x0 == null) return; dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!horiz) { if (Math.abs(dx) < 12) return; if (Math.abs(dy) > Math.abs(dx)) { x0 = null; return; } horiz = true; try { el.setPointerCapture(e.pointerId); } catch (er) {} el.style.transition = 'none'; }
    el.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
    const yd = lefty() ? -dx : dx; el.classList.toggle('sw-yes', yd > 70); el.classList.toggle('sw-no', yd < -70);
  });
  const end = () => {
    if (x0 == null) return; x0 = null; el.style.transition = '';
    if (horiz && Math.abs(dx) > 90) { el.style.transform = `translateX(${dx > 0 ? 120 : -120}%) rotate(${dx > 0 ? 12 : -12}deg)`; el.style.opacity = '0'; const ok = lefty() ? dx < 0 : dx > 0; setTimeout(() => doAnswer(ok, true), 160); }
    else { el.style.transform = ''; el.classList.remove('sw-yes', 'sw-no'); }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function render() {
  const v = view();
  if (v.lang) ui.lang = v.lang;
  const want = (views[1] && views[1].lang) || null;
  if (S.lastLang !== want) { S.lastLang = want; save(); }
  for (const k of Object.keys(S.langs)) {
    const Lk = S.langs[k]; if (VT.grantStartBonus(Lk)) save(); const r = VT.settleGoal(Lk);
    if (r) {
      VT.addNote(S, k, null, `Wette verloren: ${r.days} Tage am Stück nicht geschafft, ${r.stake} Punkte Einsatz weg.`); S.notes[S.notes.length - 1].kind = 'bet';
      save(); setTimeout(() => queueScene({ kind: 'bet', won: false, lang: k, title: 'Wette verloren', amount: r.stake, points: Lk.points || 0, mot: motivation('lost'), state: VT.plantState(VT.streak(Lk).days) }), 200);
    }
    if (!Lk.session) { const pd = Lk.plantDays; const ev = VT.plantCheck(Lk); if (ev || pd !== Lk.plantDays) save(); }
  }
  $app.innerHTML = (screens[v.v] || screens.start)();
  document.documentElement.classList.toggle('lefty', lefty());
  const it = (v.v === 'session' || v.v === 'practice') ? curItem() : null;
  const key = v.v + (it ? ':' + it.id + ':' + it.dir : '');
  if (key !== ui.speakKey) { ui.speakKey = key; try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }
  bindSwipe(); springBars(); countUps();
  const ti = document.getElementById('typeIn'); if (ti) setTimeout(() => { try { ti.focus({ preventScroll: true }); } catch (e) {} }, 60);
}

/* ---------- Aktionen ---------- */
function autoSpeak() {
  if (ttsMode() !== 'auto') return;
  const it = curItem(); if (!it) return; const c = S.langs[ui.lang].cards[it.id]; if (c) speakCard(c, ui.lang, true);
}
function curRun() { const Lg = S.langs[ui.lang]; return view().v === 'practice' ? Lg.practice : Lg.session; }
function curItem() { const Lg = S.langs[ui.lang]; return view().v === 'practice' ? VT.practiceItem(Lg) : (Lg.session && VT.currentItem(Lg)); }
/* ---------- Übergangs-Animation zwischen den Teilen ---------- */
function partKey() {
  const Lg = S.langs[ui.lang]; const v = view().v;
  if (v === 'practice') { const it = Lg.practice && VT.practiceItem(Lg); return it ? { stage: 'pr', dir: it.dir } : null; }
  if (v === 'session') { const s = Lg.session; const it = s && VT.currentItem(Lg); return it ? { stage: s.stage, dir: it.dir, n: s.queue.length } : null; }
  return null;
}
function doAnswer(ok, fromSwipe) {
  const Lg = S.langs[ui.lang]; const o = curRun(); if (!o || !o.flipped) return;
  const before = partKey();
  if (!fromSwipe) cardGhost(ok);
  let finished = false;
  if (view().v === 'practice') VT.practiceAnswer(Lg, ok);
  else { VT.answer(Lg, ok); finished = !Lg.session; }
  flush(); render();
  answerFx(ok);
  if (finished) sessionEnded(ui.lang); else showTransition(before, partKey());
}
// Sitzung fertig: lange Vibration, danach Pflanzen- und Wett-Szenen
function sessionEnded(lang) {
  const Lg = S.langs[lang]; const sm = Lg.lastSummary; ui.combo = 0;
  vibe(700);
  if (VT.sessionsToday(Lg) === 1) ui.bumpLang = lang;
  if (!sm) return;
  plantScenes(sm.plant).forEach(sc => queueScene(sc));
  if (sm.goal && sm.goal.ok && sm.goal.bonus) {
    const amount = sm.goal.stake + sm.goal.bonus;
    VT.addNote(S, lang, null, `Wette gewonnen: ${sm.goal.days} Tage am Stück geschafft, +${amount} Punkte.`); S.notes[S.notes.length - 1].kind = 'bet';
    queueScene({ kind: 'bet', won: true, lang, title: 'Wette gewonnen!', amount, points: Lg.points || 0, mot: motivation('won'), state: VT.plantState(VT.streak(Lg).days) });
    flush();
  }
}
function startPracticeWith(ids, mode, again, typing) {
  const Lg = S.langs[ui.lang]; if (!ids.length) return;
  const p = VT.startPractice(Lg, ids, mode); p.ids = ids.slice(); p.mode = mode; p.typing = !!typing; flush();
  if (again) render(); else go({ v: 'practice', lang: ui.lang });
}

            try { const a = document.createElement('a'); a.href = URL.createObjectURL(backupBlob()); a.download = backupName('vor-reset'); document.body.appendChild(a); a.click(); a.remove(); } catch (er) {}
            S = VT.newState(); S.hasUndo = true; await flush(); toast('Alles zurückgesetzt'); views = [{ v: 'start' }, { v: 'settings' }]; ensureTrap();

};
function backupBlob() { return new Blob([JSON.stringify(VT.backupObject(Object.assign({}, S, { hasUndo: false })), null, 1)], { type: 'application/json' }); }
function backupName(x) { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `vokabeltrainer-sicherung-${x ? x + '-' : ''}${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.json`; }

$app.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.psel) { t.checked ? ui.prSel.add(t.dataset.psel) : ui.prSel.delete(t.dataset.psel); updPrBtns(S.langs[ui.lang]); return; }
  if (t.dataset && t.dataset.hsel) { t.checked ? ui.hardSel.add(t.dataset.hsel) : ui.hardSel.delete(t.dataset.hsel); updHardBtns(S.langs[ui.lang]); return; }
  if (t.dataset && t.dataset.sel) { t.checked ? ui.sel.add(t.dataset.sel) : ui.sel.delete(t.dataset.sel); const b = document.getElementById('retBtn'); if (b) { b.disabled = !ui.sel.size; b.textContent = ui.sel.size ? ui.sel.size + ' zurückholen' : 'Vokabeln zum Zurückholen antippen'; } return; }
  if (t.dataset && t.dataset.chk) { ui.pr[t.dataset.chk] = t.checked; render(); return; }
  if (t.dataset && t.dataset.take) { t.checked ? ui.importTake.add(t.dataset.take) : ui.importTake.delete(t.dataset.take); return; }
  if (t.tagName === 'SELECT' && t.dataset.in) return; // schon über input behandelt
  if (t.id === 'impFile' && t.files[0]) {
    ui.importErr = null; ui.importInfo = null; ui.importPlan = null; ui.importTake = new Set();
    try {
      const obj = JSON.parse(await t.files[0].text());
      if (obj && obj.format === 'vokabeltrainer-backup-v1') { ui.importErr = ['Das ist eine Sicherungsdatei. Spiele sie unter Einstellungen → „Sicherung einspielen“ ein.']; }
      else { const errs = VT.validateImport(obj); if (errs.length) ui.importErr = errs; else ui.importPlan = VT.planImport(S, obj); }
    } catch (er) { ui.importErr = ['Die Datei konnte nicht gelesen werden. Ist es die .json-Datei aus der Mail?']; }
    render(); return;
  }
  if (t.id === 'restoreFile' && t.files[0]) {
    try {
      const st = VT.readBackup(JSON.parse(await t.files[0].text()));
      if (!st) { toast('Das ist keine Sicherungsdatei vom Vokabeltrainer.'); return; }
      const n = Object.values(st.langs).reduce((a, l) => a + Object.keys(l.cards).length, 0);
      if (!await confirmBox({ title: 'Sicherung einspielen?', text: `Die Sicherung enthält ${n} Vokabeln. Der aktuelle Stand auf diesem Handy wird dabei ersetzt.`, ok: 'Einspielen', danger: true })) return;
      S = st; S.hasUndo = false; await flush(); askPersist(); toast('Sicherung eingespielt'); setViews([{ v: 'start' }]);
    } catch (er) { toast('Die Datei konnte nicht gelesen werden.'); }
  }
});
$app.addEventListener('submit', e => {
  if (e.target.id === 'typeForm') { e.preventDefault(); actions.checkTyped(); return; }
  if (e.target.id !== 'editForm') return; e.preventDefault();
  const v = view(); const Lg = S.langs[v.lang]; const fd = new FormData(e.target); const g = k => (fd.get(k) || '').toString().trim();
  if (!g('fremd') || !g('deutsch')) { toast('Bitte das Wort in beiden Sprachen eintragen.'); return; }
  const buch = g('buch') || 'Eigene Vokabeln'; let nr = parseInt(g('nr'), 10);
  const data = { buch, fremd: g('fremd'), lautschrift: g('lautschrift'), deutsch: g('deutsch'), satz_fremd: g('satz_fremd'), satz_deutsch: g('satz_deutsch'), notiz: g('notiz'), genus: g('genus'), abschnitt: g('abschnitt'), seite: g('seite') === '' ? null : Number(g('seite')) };
  if (v.id) {
    const c = Lg.cards[v.id]; if (!nr) nr = c.nr;
    const clash = VT.findByBuchNr(Lg, buch, nr); if (clash && clash.id !== c.id) { toast(`Nr. ${nr} gibt es in „${buch}“ schon.`); return; }
    Object.assign(c, data, { nr });
    toast('Gespeichert'); save(); back();
  } else {
    if (!nr) nr = VT.nextNr(Lg, buch);
    if (VT.findByBuchNr(Lg, buch, nr)) { toast(`Nr. ${nr} gibt es in „${buch}“ schon.`); return; }
    const c = VT.makeCard(Lg, Object.assign(data, { nr }));
    if (fd.get('aktiv')) VT.activate(Lg, [c.id]);
    toast('Vokabel angelegt' + (fd.get('aktiv') ? ' und auf Neu gelegt' : '')); save(); back();
  }
});

    ['soupçonner qn de qc', '[supsɔne]', '', 'jdn. einer Sache verdächtigen', 'On me soupçonnait.', 'Man verdächtigte mich.', '→ un soupçon', 'B5']
  ];
  const obj = { format: 'vokabelkasten-import-v1', sprache: 'fr', buch: B, vokabeln: rows.map((r, i) => ({ nr: i + 1, seite: 169, abschnitt: r[7], fremd: r[0], lautschrift: r[1], genus: r[2], deutsch: r[3], satz_fremd: r[4], satz_deutsch: r[5], notiz: r[6],
    pruefen: i < 6 ? ['Abschnitt steht auf der Seite davor (Beispiel für einen Hinweis)'] : (i === 14 ? ['Wortanfang im Foto verdeckt, gelesen als „hésiter“'] : []) })) };
  const plan = VT.planImport(S, obj); VT.applyImport(S, plan, new Set());
  // Hinweise zu fehlendem Abschnitt zusammenfassen: nur der ausdrückliche Hinweis zählt
  save(); askPersist(); toast('20 Beispielvokabeln geladen (Nr. 1–20, inaktiv)');
  setViews([{ v: 'start' }, { v: 'lang', lang: 'fr' }]);
}

/* ---------- Notfall-Schnappschüsse (7 Tage, im Gerät) ---------- */
const SNAP_MAX = 7;
function cardTotal(st) { return Object.values(st.langs || {}).reduce((a, l) => a + Object.keys(l.cards || {}).length, 0); }
function snapLabel(sn) { const d = new Date(sn.t); return (sn.note ? sn.note + ' · ' : '') + d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' }) + ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; }
function snapInfo(sn) { return Object.entries(VT.LANGS).map(([k, l]) => { const L = sn.state.langs[k]; return L ? `${l.short}: ${Object.keys(L.cards).length} Vokabeln, ${L.sessionCount} Sitzungen` : ''; }).filter(Boolean).join(' · '); }
async function loadSnaps() { try { ui.snaps = (await store.get('snaps')) || []; } catch (e) { ui.snaps = []; } }
async function takeSnapshot(note) {
  if (!cardTotal(S)) return;
  await loadSnaps();
  const today = VT.dayKey(Date.now());
  if (!note && ui.snaps.some(sn => !sn.note && sn.day === today)) return;
  const copy = JSON.parse(JSON.stringify(S)); delete copy.hasUndo;
  ui.snaps.push({ day: today, t: Date.now(), note: note || '', state: copy });
  const daily = ui.snaps.filter(sn => !sn.note).slice(-SNAP_MAX), notes = ui.snaps.filter(sn => sn.note).slice(-2);
  ui.snaps = daily.concat(notes).sort((a, b) => a.t - b.t);
  await store.set('snaps', ui.snaps);
}
actions.snapRestore = async el => {
  const sn = ui.snaps[+el.dataset.i]; if (!sn) return;
  if (!await confirmBox({ title: 'Diesen Stand wiederherstellen?', text: `Stand: <b>${esc(snapLabel(sn))}</b><br>${esc(snapInfo(sn))}<br><br>Dein jetziger Stand wird vorher als „vor Wiederherstellung“ gemerkt, du kannst also auch wieder zurück.`, ok: 'Wiederherstellen' })) return;
  await takeSnapshot('vor Wiederherstellung');
  S = JSON.parse(JSON.stringify(sn.state)); S.hasUndo = false; await flush(); toast('Stand wiederhergestellt'); setViews([{ v: 'start' }, { v: 'settings' }]);
};

/* ---------- Datei über „Teilen“ geöffnet (nur installierte App) ---------- */
async function takeShared() {
  if (!/[?&]shared=1/.test(location.search)) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  let txt = null;
  try { const c = await caches.open('vt-share'); const key = new URL('shared-file', location.href).href; const r = await c.match(key); if (r) { txt = await r.text(); await c.delete(key); } } catch (e) {}
  if (!txt) { toast('Die geteilte Datei ist nicht angekommen. Wähle sie unter „Import“ aus.'); return; }
  let obj; try { obj = JSON.parse(txt); } catch (e) { toast('Die geteilte Datei ist keine Vokabel-Datei.'); return; }
  if (obj && obj.format === 'vokabeltrainer-backup-v1') {
    const st = VT.readBackup(obj); if (!st) { toast('Die Sicherung ist beschädigt.'); return; }
    const n = Object.values(st.langs).reduce((a, l) => a + Object.keys(l.cards).length, 0);
    setViews([{ v: 'start' }, { v: 'settings' }]);
    if (await confirmBox({ title: 'Sicherung einspielen?', text: `Die geteilte Sicherung enthält ${n} Vokabeln. Der aktuelle Stand auf diesem Handy wird dabei ersetzt.`, ok: 'Einspielen', danger: true })) {
      S = st; S.hasUndo = false; await flush(); toast('Sicherung eingespielt'); setViews([{ v: 'start' }]);
    }
    return;
  }
  const errs = VT.validateImport(obj);
  ui.importErr = errs.length ? errs : null; ui.importInfo = null; ui.importTake = new Set();
  ui.importPlan = errs.length ? null : VT.planImport(S, obj);
  const lang = (!errs.length && obj.sprache) || S.lastLang || 'fr';
  ui.lang = lang; setViews([{ v: 'start' }, { v: 'lang', lang }, { v: 'import', lang }]);
}

/* ---------- Start ---------- */
(async () => {
  await store.open();
  try { const st = await store.get('state'); if (st && st.langs) { S = st; for (const k of Object.keys(VT.LANGS)) if (!S.langs[k]) S.langs[k] = VT.newLang(); S.notes = S.notes || []; } } catch (e) {}
  if (S.lastLang && S.langs[S.lastLang]) { views = [{ v: 'start' }, { v: 'lang', lang: S.lastLang }]; ensureTrap(); }
  await takeSnapshot();
  render();
  takeShared();
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
  }
})();
})();

</script>
